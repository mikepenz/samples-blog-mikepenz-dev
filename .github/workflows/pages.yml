# Builds every sample (a top-level folder with a gradlew) and publishes them to GitHub Pages as /<sample>/.
# Security: no default token permissions, actions pinned to commit SHAs, no caches, no credentials left in the checkout,
# wrapper jar validated, pull requests build but never deploy, deploy only from main through the github-pages environment.
name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build samples
        run: |
          set -euo pipefail
          mkdir _site
          for g in */gradlew; do
            n=${g%/gradlew}
            case "$n" in *[!a-z0-9-]*) echo "bad sample name: $n" >&2; exit 1;; esac
            (cd "$n" && ./gradlew --no-daemon --console=plain wasmJsBrowserDistribution)
            mkdir "_site/$n"
            cp -R "$n/build/dist/wasmJs/productionExecutable/." "_site/$n/"
          done
          find _site -name '*.map' -delete
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          du -sh _site/*
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
